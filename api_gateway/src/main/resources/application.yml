server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            - id: emergency-service
              uri: lb://emergency-service
              predicates:
                - Path=/api/emergencies/**

            - id: responder-service
              uri: lb://responder-service
              predicates:
                - Path=/api/responders/**

            - id: dispatch-service
              uri: lb://dispatch-service
              predicates:
                - Path=/api/dispatch/**

            - id: hospital-service
              uri: lb://hospital-service
              predicates:
                - Path=/api/hospitals/**

            - id: tracking-service
              uri: lb://tracking-service
              predicates:
                - Path=/api/tracking/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
