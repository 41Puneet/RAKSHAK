name: RAKSHAK CI

on:
  push:
  pull_request:

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api_gateway, service_registry, auth_service, emergency_service, dispatch_service, responder_service, hospital_service, tracking_service, notification_service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and test
        working-directory: ${{ matrix.service }}
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: SpotBugs
        working-directory: ${{ matrix.service }}
        run: ./mvnw --batch-mode --no-transfer-progress com.github.spotbugs:spotbugs-maven-plugin:check
      - name: Checkstyle
        working-directory: ${{ matrix.service }}
        run: ./mvnw --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-checkstyle-plugin:check
      - name: PMD
        working-directory: ${{ matrix.service }}
        run: ./mvnw --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-pmd-plugin:check

  docker-images:
    needs: build-test-analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all service artifacts
        run: |
          for service in api_gateway service_registry auth_service emergency_service dispatch_service responder_service hospital_service tracking_service notification_service; do
            (cd "$service" && ./mvnw --batch-mode --no-transfer-progress package -DskipTests)
          done
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish images
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/rakshak
        run: |
          for service in api_gateway service_registry auth_service emergency_service dispatch_service responder_service hospital_service tracking_service notification_service; do
            image_name=$(echo "$service" | tr '[:upper:]_' '[:lower:]-')
            docker build -t "$IMAGE_PREFIX/$image_name:${GITHUB_SHA}" "$service"
            docker push "$IMAGE_PREFIX/$image_name:${GITHUB_SHA}"
          done
