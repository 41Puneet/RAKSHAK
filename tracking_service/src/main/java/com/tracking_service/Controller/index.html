<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs/bundles/stomp.umd.min.js"></script>
</head>
<body>

<button onclick="connect()">Connect</button>
<button onclick="sendLocation()">Send Location</button>

<script>

let client;

function connect(){

    client = new StompJs.Client({
        brokerURL:'ws://localhost:8084/tracking',

        onConnect:function(frame){
            console.log("Connected");
        }
    });

    client.activate();

}

function sendLocation(){

    client.publish({

        destination:'/app/location/update',

        body:JSON.stringify({

           
  "entityId":"9b8d6f2f-1f3b-4baf-9d34-3c2e2ef97e16",
  "entityType":"RESPONDER",
  "latitude":28.6150,
  "longitude":77.2105,
  "timestamp":"2026-07-12T14:55:00"
}

        )

    });

}

</script>

</body>
</html>
